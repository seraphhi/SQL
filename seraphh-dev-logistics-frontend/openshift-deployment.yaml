apiVersion: v1
kind: Template
metadata:
  name: seraphh-dev-logistics-frontend
  annotations:
    description: "Despliegue del Frontend React para el sistema de logística y transporte en OpenShift."
    tags: "react, frontend, logistics"
objects:
- apiVersion: apps.openshift.io/v1
  kind: DeploymentConfig
  metadata:
    name: logistics-frontend
    labels:
      app: logistics-frontend
      project: seraphh-dev
  spec:
    replicas: 2
    selector:
      app: logistics-frontend
    template:
      metadata:
        labels:
          app: logistics-frontend
      spec:
        containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/seraphh-dev/logistics-frontend:latest
          ports:
          - containerPort: 8080
            protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
    triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
        - frontend
        from:
          kind: ImageStreamTag
          name: logistics-frontend:latest

- apiVersion: v1
  kind: Service
  metadata:
    name: logistics-frontend-svc
    labels:
      app: logistics-frontend
      project: seraphh-dev
  spec:
    ports:
    - name: web
      port: 80
      targetPort: 8080
    selector:
      app: logistics-frontend
    type: ClusterIP

- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: logistics-frontend-route
    labels:
      app: logistics-frontend
      project: seraphh-dev
  spec:
    to:
      kind: Service
      name: logistics-frontend-svc
    port:
      targetPort: web
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
