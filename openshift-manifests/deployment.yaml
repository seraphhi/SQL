apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-frontend
  namespace: logistics-system
  labels:
    app: logistics-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logistics-frontend
  template:
    metadata:
      labels:
        app: logistics-frontend
    spec:
      containers:
      - name: nginx-angular
        image: quay.io/logistics/logistics-frontend:1.0.0
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-angular-config
