apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: logistics-frontend-route
  namespace: logistics-system
  labels:
    app: logistics-frontend
spec:
  to:
    kind: Service
    name: logistics-frontend-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
