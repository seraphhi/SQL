apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-react-config
  namespace: seraphh-dev
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html index.htm;
        location / {
            try_files $uri $uri/ /index.html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: react-frontend
  namespace: seraphh-dev
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: react-frontend-build
  namespace: seraphh-dev
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      noCache: false
  output:
    to:
      kind: ImageStreamTag
      name: react-frontend:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: seraphh-dev
  labels:
    app: react-frontend
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"react-frontend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name=="nginx-react")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend
    spec:
      containers:
      - name: nginx-react
        # OpenShift inyectará la imagen compilada aquí
        image: image-registry.openshift-image-registry.svc:5000/seraphh-dev/react-frontend:latest
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-react-config
---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service
  namespace: seraphh-dev
  labels:
    app: react-frontend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: react-frontend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: react-frontend-route
  namespace: seraphh-dev
  labels:
    app: react-frontend
spec:
  to:
    kind: Service
    name: react-frontend-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
